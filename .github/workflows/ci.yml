name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The end-to-end tests drive the real orchestrator, so it is installed here too.
      - run: pip install -e orchestrator
      - working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          PHANTOM_PYTHON: python
          NEXT_TELEMETRY_DISABLED: "1"
